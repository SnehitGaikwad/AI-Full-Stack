<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding:0;
            box-sizing: border-box;
        }

        .container{
            height: 100vh;
            width: 100%;
            background-color: aqua;
            display: flex;

            flex-wrap: wrap;

        }


        .box_1{
            height:400px;
            width: 20%;
            background-color: violet;
        }


        .box_2{
            height:400px;
            width: 20%;
            background-color: rgb(131, 71, 16);
        }


        .box_3{
            height:400px;
            width: 20%;
            background-color: rgb(233, 236, 13);
        }


        .box_4{
            height:400px;
            width: 20%;
            background-color: rgb(1, 174, 4);
        }


        .box_5{
            height:400px;
            width: 20%;
            background-color: rgb(23, 23, 235);
        }





        /* media

        mobile- 1 box per row
        tablet - 2 box per row

        laptop:3 box per row

        /* desktop-large screen- 5 box per row */

    

        /* for mobile devices */
        /* 0-767px */

        @media screen And (max-width:767px) {
            .box_1,.box_2,.box_3,.box_4,.box_5{
                width: 100%;
            }
                
        }

        /* for tablet */

        @media screen And (min-width:768px) {

              .box_1,.box_2,.box_3,.box_4,.box_5{
                width: 50%;
            }
            
        }

        /* laptop */

        @media screen And (min-width:1024px) {
             .box_1,.box_2,.box_3,.box_4,.box_5{
                width: 33.33%;
            }
        }


        /* desktop */
        @media screen And (min-width:1280px) {

             .box_1,.box_2,.box_3,.box_4,.box_5{
                width: 20%;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="box_1"></div>
        <div class="box_2"></div>
        <div class="box_3"></div>
        <div class="box_4"></div>
        <div class="box_5"></div>
    </div>
</body>
</html>
