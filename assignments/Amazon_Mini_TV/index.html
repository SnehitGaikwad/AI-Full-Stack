<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Mini TV</title>
    <!-- Font Awesome -->
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            height: auto;
            width: 100%;
            display: flex;
            background-color: rgb(200, 255, 255);

        }


        .header_section {
            height: 65px;
            width: 100%;
            background-color: rgb(255, 255, 255);
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
        }

        .header_section_1,
        .header_section_2,
        .header_section_3 {
            display: flex;
            align-items: center;
            justify-content: center;
            display: flex;
            height: 100%;
        }

        .header_section_1 {
            background-color: #1A2224;
        }

        .header_section_2 {
            background-color: #1A2224;
            word-spacing: 30px;
            
        }

        .header_section_2 p {
            font-family: "Amazon Ember", Arial, sans-serif;
            font-size: 15px;
            font-weight: 700;
            line-height: 15px;
            color: rgb(255, 255, 255);  
        }

        .header_section_3 {
            background-color: #1A2224;          
        }
       
        .hero_section_02{
           padding-left: 20px;
            padding-top: 20px;
            height: 300px;
            width: 100%;
            background-color: rgb(169, 86, 86);
            display: flex;
            display:grid;
            
        }
        .hero_section_02,.section_1{
          
            height:150px;
            width:100%;
            background-color: aqua;
            display: flex;
           
        
        }

        .hero_section_02,.section_2{
            height: 150px;
            width: 100%;
            background-color: rgb(112, 39, 39);

            display: flex;

            justify-content: space-around;
        }

    
       
    </style>
</head>

<body>
    <main class="container">
        <header class="header_section">
            <div class="header_section_1">
            <img src="./source/mx logo.svg" height="25px" alt="MX Logo">    
            </div>

            <div class="header_section_2">
                <p style="padding: 20px;">Home</p>
                <P style="padding: 20px;">New&Hot</P>
                <p style="padding: 20px;">WebSeries</p>    
                <p style="padding: 20px;">Movies</p>
                <p style="padding: 20px;">VDesi</p>
                <p style="padding: 20px;">Romance</p> 
                <p style="padding: 20px;">Comedy</p>
                <p style="padding: 20px;">Tamil</p>
                <p style="padding: 20px;">Telgu</p>
                
               

            <div class="header_section_3">
                <img src="./source/search.png" height="25px" alt="Search Icon" 
                    style="margin-right: 70px;">
                <img src="./source/amazon logo.svg" height="25px" alt="Amazon Logo">
                <img src="./source/settings.png" height="25px" alt="settings Icon" style="margin-left: 70px;">
            
            </div>
        </header>
             </main>
             <!-- Hero Section_01 -->

             <section class="hero_section_01">
                <img src="./source/navbar.jpg" alt=" Hero Image" style="width: 100%; height: 100%;">
             </section>

            <!-- hero section 02 -->

            <section class="hero_section_02">
                <div class="section_1"><p> Tranding Top 20</p> </div>
             </section>   
                <div class="section_2">
                    <img src="./source/img1.jpg" alt="" height="100px" > 
                    <img src="./source/img2.jpg" alt="" height="100px"> 
                    <img src="./source/img3.png" alt="" height="100px" > 
                    <img src="./source/img4.jpg" alt="" height="100px"> 
                    
                </div>


             </section>

             <section class="hero_section_03">
               
             </section>


            

                

</body>

</html>
