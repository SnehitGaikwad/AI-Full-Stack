    <script>

        let shop_Amt = Number(prompt("Enter Shopping Amount"));

        let disc;

        if (shop_Amt >= 20000) {
            disc = 20;
        }
        else if (shop_Amt >= 30000) {
            disc = 30;
        }
        else if (shop_Amt >= 40000) {
            disc = 40;
        }
        else {
            disc = 0;
        }

        alert("Shopping Amount = " + shop_Amt +
            "\nDiscount = " + disc + "%");
    </script>
