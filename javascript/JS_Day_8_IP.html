    <script>

        // type coercion- JS automatically converts data types

        console.log(10+20);//30
        console.log(30+"50")//3050

        console.log(20+"ABC");//20ABC

        console.log(10*10)//100
        console.log(30*"10")//300

        console.log(10*"ABC")// NaN- Not A Number- inavlid Expression

        console.log(100+"ABC"+200);//100ABC200

        console.log(30+40+"ABC")//



        // type casting
        // manual / explicity conversion of data types
        // 
        // string to Number - Number() / + / parseInt()
        // Number to string-  str()

        console.log(20+"100")//20100

        console.log(20+Number("100"))//120

       
        




    </script>
