<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- var keyword -->

    <!-- ES-5 feature- Old JS 

        used to declared JS variable

        we can declared variable without initilzation

        we can redeclared varaible with same name

        we can update variable data

        scope- global scope 

        
     
    
    -->


    <script>


        document.write("<h1>var declartors in JS</h1>")


        // used to declared variable

        var name = "Pratik";

        console.log(name)
        // document.write(name)
        // alert(name)



        // we can declared variable without initilzation

        // var age; // declarations
        // age=25 // initilazation

        var skill;
        skill = "AI FUll stack";

        console.log(skill)


        // we can redeclared variable with same name
        // 
        var empRole="AI engineer";
        var empRole=1245; 

        console.log(empRole)


        // we can update variable data

        //
        var empCTC="20LPA";
        empCTC="10LPA"

        console.log(empCTC)




        // var scope- global scope




    </script>

</body>

</html>
