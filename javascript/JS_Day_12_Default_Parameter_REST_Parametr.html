<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>
        function Demo(a, b) {
            return a + b;
        }
        let res = Demo(100, 400) + 200;
        console.log(res);//500



        // 

        function Demo2(a, b, c) {
            // return
            console.log(a + b)

        }
        // Demo2(60,20)//80
        Demo2(20, 10, 1000, 2000, 1000)//output 
        //JS by default ignore extra arguments




        function Emp(name, skill) {
            return `Your Name Is ${name} and your skill is <mark>${skill}</mark>`;
        }

        // let emp1=Emp(100,true)
        // document.write(emp1)

        let emp2 = Emp("ABC")
        console.log(emp2);//undefined


        //Solution- default parameters
        //  passing defaut parameters / value while function declaration
        // to avoid errors
        // useful when we didnt pass enough arguments


        function Addition(x = 0, y = 0, z = 0) {
            console.log(x + y + z)
        }
        Addition(20, 40, 60);
        Addition(30, 20);//NaN

        Addition(10, 40)

        Addition(100)//100+0+0

        Addition()

        // Addition(10, 20, 15, 1000, 2000, 4000)




        function Multi(x = 1, y = 1, z = 1) {
            console.log(x * y * z)
        }
        Multi(20, 40, 60);
        Multi(30, 20);

        Multi(10, 40)

        Multi(100)//100*1=100

        Multi()



        // REST PARAMETER- when we passed extra additional arguments
        // REST Parameter handles extra values  i.e handles rest values
        // ES-6 Feature  /  Modern JS Feature
        // It return rest values in an Array format
        // indicate by ...

        // MOST IMP


        // let sum=0;


        function Addition(a = 0, b = 0, c = 0, ...input) {
            console.log(a + b + c)
            console.log(input)

            let sum = a + b + c;

            for (let x of input) {
                // console.log(x)
                sum += x
            }


            console.log(`Sum Is ${sum}`)


        }
        Addition()//0

        Addition(100, 200, 300)//600

        Addition(10, 10, 20, 1000, 2000, 2500, 3000);//60




        // for(let i=0;i<=100;i++)
        // 
        // forin / forof looping  statements i.r use to iterate array object
        // ES-6 feature

        // forin
        // used to interate array object
        // return key and value
        // syntax



        const arr = [10, 30, 40, 50]


        for (let x in arr) {
            // console.log(x)
            // console.log(arr[x])

            console.log(`${x} : ${arr[x]}`)
        }


        // forof- used to iterate array object
        // it return only values
        //it must be iterable i.e index

        for (let x of arr) {
            console.log(x)// value
        }



        




    </script>
</body>
