<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <!-- IIFE - Immediate Invoking Function Expression -->
     <!-- Self invoking - calling itself
      
     (
     
     funtion()
     {
     
     
     }
     
     
     )()
     
     -->

     <script>

        (
            function()
            {
              console.log("hello IIFE")
            }
            
        )()
        

     </script>
    
</body>
</html>
