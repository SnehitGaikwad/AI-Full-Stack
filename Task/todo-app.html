<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do List</title>

<style>
  /* ---------- COLORS ---------- */
  :root {
    --purple: #4f46e5;
    --green:  #22b455;
    --red:    #ef4444;
    --blue:   #2563eb;
    --text:   #1f2937;
    --muted:  #6b7280;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    min-height: 100vh;
    padding: 30px 16px;
    font-family: Arial, sans-serif;
    background: linear-gradient(160deg, #c7d2fe, #e9d5ff);
    color: var(--text);
  }

  /* ---------- THE CENTER CARD ---------- */
  .todo-container {
    max-width: 520px;
    margin: 0 auto;            /* this centers the card */
    background: white;
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 15px 40px rgba(79, 70, 229, 0.25);
  }

  h1 { text-align: center; margin-bottom: 4px; }
  #counter { text-align: center; color: var(--muted); margin-bottom: 20px; }

  /* ---------- ADD TASK ROW ---------- */
  .add-row { display: flex; gap: 8px; margin-bottom: 20px; }

  input {
    flex: 1;
    padding: 12px;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    font-size: 1rem;
  }
  input:focus { outline: none; border-color: var(--purple); }

  button {
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }

  #addBtn     { background: var(--purple); padding: 10px 22px; }
  .done-btn   { background: var(--green); }
  .undo-btn   { background: var(--blue); }
  .delete-btn { background: var(--red); }

  /* ---------- TASK LIST ---------- */
  #taskList { list-style: none; padding: 0; }

  #taskList li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #f3f4f6;
    border-radius: 12px;
  }
  #taskList li.finished { background: #dcfce7; }

  #taskList .task-text { flex: 1; word-break: break-word; }
  #taskList .task-text.crossed { text-decoration: line-through; color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 20px 0; }
</style>
</head>

<body>

  <!-- HTML: the bones -->
  <div class="todo-container">
    <h1>✅ My To-Do List</h1>
    <p id="counter"></p>

    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Add a task...">
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>
  </div>

<script>
  // =========================================================
  // STEP 1: Load the old tasks from Local Storage
  // "tasks" is an ARRAY. Each task is an OBJECT like:
  //     { text: "Learn JavaScript", done: false }
  // If nothing is saved yet, we start with an empty array [].
  // =========================================================
  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];


  // =========================================================
  // STEP 2: Get the parts of the page we need
  // =========================================================
  const input   = document.getElementById("taskInput");
  const addBtn  = document.getElementById("addBtn");
  const list    = document.getElementById("taskList");
  const counter = document.getElementById("counter");


  // =========================================================
  // STEP 3: Save the tasks array into Local Storage
  // (arrays must be changed into text first, using JSON.stringify)
  // =========================================================
  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }


  // =========================================================
  // STEP 4: ADD TASK
  // value -> push to "tasks" array -> save to storage -> refresh the screen
  // =========================================================
  function addTask() {
    const task = input.value.trim();      // trim() removes extra spaces

    if (task !== "") {
      tasks.push({ text: task, done: false });   // add to the array
      input.value = "";                          // clear the input box
      saveTasks();                               // save
      showTasks();                               // refresh the screen
    }
  }


  // =========================================================
  // STEP 5: SHOW TASKS on the page
  // forEach goes through every task, one by one.
  // "index" is the position of the task in the array (0, 1, 2 ...)
  // =========================================================
  function showTasks() {
    list.innerHTML = "";                     // clear the old list first

    if (tasks.length === 0) {
      list.innerHTML = '<p class="empty">No tasks yet. Add one above! ✨</p>';
    }

    tasks.forEach(function (task, index) {

      // make the <li> for this task
      const li = document.createElement("li");
      if (task.done) li.className = "finished";

      // the task text (crossed out if done)
      const span = document.createElement("span");
      span.className = "task-text";
      if (task.done) span.className += " crossed";   // line-through style
      span.textContent = task.text;

      // the Done / Undo button
      const doneBtn = document.createElement("button");
      doneBtn.textContent = task.done ? "Undo" : "Done";
      doneBtn.className   = task.done ? "undo-btn" : "done-btn";
      doneBtn.onclick = function () { toggleTask(index); };

      // the Delete button
      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete";
      deleteBtn.className = "delete-btn";
      deleteBtn.onclick = function () { deleteTask(index); };

      // put everything inside the <li>, then the <li> inside the <ul>
      li.appendChild(span);
      li.appendChild(doneBtn);
      li.appendChild(deleteBtn);
      list.appendChild(li);
    });

    showCounter();
  }


  // =========================================================
  // STEP 6: TOGGLE (Done <-> Undo)
  // If done is true make it false, if false make it true
  // =========================================================
  function toggleTask(index) {
    tasks[index].done = !tasks[index].done;     // ! means "the opposite"
    saveTasks();
    showTasks();
  }


  // =========================================================
  // STEP 7: DELETE
  // splice(index, 1) removes 1 item from the array at that position
  // =========================================================
  function deleteTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    showTasks();
  }


  // =========================================================
  // Small helper: show "2 of 5 tasks done"
  // =========================================================
  function showCounter() {
    let doneCount = 0;
    for (const task of tasks) {
      if (task.done) doneCount = doneCount + 1;
    }
    counter.textContent = doneCount + " of " + tasks.length + " tasks done";
  }


  // =========================================================
  // STEP 8: EVENTS - connect the button and Enter key to addTask
  // =========================================================
  addBtn.addEventListener("click", addTask);

  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") addTask();
  });


  // =========================================================
  // START: show the saved tasks when the page opens
  // =========================================================
  showTasks();
</script>
</body>
</html>
